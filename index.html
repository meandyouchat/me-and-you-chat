<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me & You Chat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;
 justify-content:center;align-items:center;
 background:#100b1c;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
.container{
 width:100%;max-width:400px;padding:30px;
 background:#1d1530;border:1px solid #7045a5;
 border-radius:20px;text-align:center;
 box-shadow:0 0 25px #542b8050;
}
h1{color:#c59aff}
p{color:#c9bddb}
input{
 width:100%;padding:14px;margin:10px 0;
 border:1px solid #7653a5;border-radius:10px;
 background:#100b1c;color:white;font-size:15px;
}
button{
 width:100%;padding:14px;margin-top:12px;
 border:0;border-radius:10px;
 background:#9254db;color:white;
 font-size:16px;font-weight:bold;
}
.google{background:#fff;color:#222}
.switch{color:#c59aff;cursor:pointer}
#message{font-size:14px;word-break:break-word}
#chatHome{display:none}
</style>
</head>
<body>

<div class="container">
 <h1>Me & You Chat</h1>
 <p>A private chatting website</p>

 <div id="authBox">
  <h3 id="formTitle">Login</h3>

  <input id="email" type="email"
   placeholder="Enter your Gmail">

  <input id="password" type="password"
   placeholder="Enter your password">

  <button id="mainBtn">Login</button>
  <button id="googleBtn" class="google">
   Continue with Google
  </button>

  <p id="switchText">
   Don't have an account?
   <span class="switch" id="switchBtn">Register</span>
  </p>
 </div>

 <div id="chatHome">
  <h2>Welcome!</h2>
  <p id="userEmail"></p>
  <p>Your account is connected.</p>
  <button id="logoutBtn">Logout</button>
 </div>

 <p id="message"></p>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth, createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 GoogleAuthProvider, signInWithRedirect,
 getRedirectResult, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyCJhUwn5SE3jtNZ4EWSNAuvtC9xhts0Sus",
 authDomain: "me-and-you-chat-29d4e.firebaseapp.com",
 projectId: "me-and-you-chat-29d4e",
 storageBucket: "me-and-you-chat-29d4e.firebasestorage.app",
 messagingSenderId: "304987066409",
 appId: "1:304987066409:web:55e5a4a22b199a3e998c38",
 measurementId: "G-S8DTFJ0691"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let isRegister = false;

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");

document.getElementById("switchBtn").onclick = () => {
 isRegister = !isRegister;
 document.getElementById("formTitle").textContent =
  isRegister ? "Create Account" : "Login";
 document.getElementById("mainBtn").textContent =
  isRegister ? "Register" : "Login";
 document.getElementById("switchText").innerHTML =
  isRegister
  ? 'Already have an account? <span class="switch" id="switchBtn">Login</span>'
  : 'Don\'t have an account? <span class="switch" id="switchBtn">Register</span>';

 document.getElementById("switchBtn").onclick =
  document.getElementById("switchBtn").onclick ||
  (() => {});

 document.getElementById("switchBtn").addEventListener("click", () => {
  isRegister = !isRegister;
  document.getElementById("formTitle").textContent =
   isRegister ? "Create Account" : "Login";
  document.getElementById("mainBtn").textContent =
   isRegister ? "Register" : "Login";
 });
};

document.getElementById("mainBtn").onclick = async () => {
 message.textContent = "Please wait...";

 try {
  if (isRegister) {
   await createUserWithEmailAndPassword(
    auth,email.value.trim(),password.value
   );
   message.textContent = "Registration successful!";
  } else {
   await signInWithEmailAndPassword(
    auth,email.value.trim(),password.value
   );
   message.textContent = "Login successful!";
  }
 } catch(error) {
  message.textContent = error.message;
 }
};

document.getElementById("googleBtn").onclick = async () => {
 try {
  await signInWithRedirect(auth,provider);
 } catch(error) {
  message.textContent = error.message;
 }
};

getRedirectResult(auth).catch(error => {
 message.textContent = error.message;
});

onAuthStateChanged(auth,user => {
 if(user) {
  document.getElementById("authBox").style.display = "none";
  document.getElementById("chatHome").style.display = "block";
  document.getElementById("userEmail").textContent = user.email;
 } else {
  document.getElementById("authBox").style.display = "block";
  document.getElementById("chatHome").style.display = "none";
 }
});

document.getElementById("logoutBtn").onclick = async () => {
 await signOut(auth);
 message.textContent = "Logged out successfully.";
};
</script>
</body>
</html>
