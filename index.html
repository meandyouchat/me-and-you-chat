
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me & You Chat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;
 justify-content:center;align-items:center;
 background:#100b1c;color:white;
 font-family:Arial,sans-serif;
}
.container{
 width:90%;max-width:400px;padding:30px;
 background:#1d1530;border:1px solid #7045a5;
 border-radius:20px;text-align:center;
}
h1{color:#c59aff}
p{color:#c9bddb}
input{
 width:100%;padding:14px;margin:10px 0;
 border:1px solid #7653a5;border-radius:10px;
 background:#100b1c;color:white;
}
button{
 width:100%;padding:14px;margin-top:12px;
 border:0;border-radius:10px;
 background:#9254db;color:white;
 font-size:16px;font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
<h1>Me & You Chat</h1>
<p>A private chatting website</p>
<input type="email" placeholder="Enter your Gmail">
<input type="password" placeholder="Enter your password">
<button>Login</button>
<p>Don't have an account? Register</p>
</div>
</body>
</html>
